name: backward_avoidance
description: |
  Front and left are blocked, and the right path check is also blocked after a
  90-degree right turn. The revised controller checks the right path, returns
  to the original direction, and then moves backward for one tick.

tick_duration_ms: 100
max_ticks: 85
power_off_at_tick: 82

world:
  size: [8, 5]
  obstacles:
    - [5, 2]
    - [4, 1]
    - [4, 3]
  dust: []

robot:
  start: [3, 2]
  heading: E

cleaning_rates: {off: 0.0, normal: 0.5, power_up: 2.0}
init_failures: {motor: 0, cleaner: 0, obstacle_sensor: 0, dust_sensor: 0}

assertions:
  - kind: motor_history_sequence
    sequence: [RIGHT, LEFT, BACKWARD]
    description: blocked right path returns to original direction before backing up
  - kind: collision_count_eq
    value: 0
